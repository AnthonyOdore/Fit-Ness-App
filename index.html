async function carregarTreino() {
            try {
                // Busca o arquivo na mesma pasta
                const resposta = await fetch('treinos.json');
                
                // Converte o texto recebido em um objeto JavaScript
                const dadosTreino = await resposta.json();
                
                // Renderiza os dados na tela
                renderizarDados(dadosTreino);
                
            } catch (erro) {
                console.error("Erro ao carregar o JSON:", erro);
                document.getElementById('usuario').innerText = "Erro ao carregar o treino.";
            }
        }

function renderizarDados(dadosTreino) {
    document.getElementById('usuario').innerText = `Treino de ${dadosTreino.nome_usuario}`;
    document.getElementById('info-treino').innerText = `Objetivo: ${dadosTreino.objective || dadosTreino.objetivo}`;

    const containerTreinos = document.getElementById('rotina-treinos');
    containerTreinos.innerHTML = ""; // Limpa o container

    // 1. Descobre o dia da semana (0 = Domingo, 1 = Segunda, 2 = Terça, etc.)
    const diaSemana = new Date().getDay();
    let treinoDoDia = null;

    // 2. Mapeia os dias para a sua divisão (Exemplo clássico: ABC)
    // Adapte os dias conforme sua rotina (Ex: 1, 3, 5 para Seg, Qua, Sex)
    if (diaSemana === 1) { // Segunda 
        treinoDoDia = "Segunda-feira";
    }else if (diaSemana === 2) { // 
        treinoDoDia = "Terça-feira";
    }else if (diaSemana === 3) { // 
        treinoDoDia = "Quarta-feira";
    }else if (diaSemana === 4) { // 
        treinoDoDia = "Quinta-feira";
    } else if (diaSemana === 5) { // 
        treinoDoDia = "Sexta-feira";
    }else if (diaSemana === 6) { // 
        treinoDoDia = "Sábado";
    } 

    // 3. Verifica se há treino hoje e se ele existe no JSON
    if (treinoDoDia && dadosTreino.divisao_treino[treinoDoDia]) {
        const treino = dadosTreino.divisao_treino[treinoDoDia];
        
        let htmlTreino = `
            <div class="treino-bloco">
                <h2>💪 ${treinoDoDia}<small> Foco: ${treino.foco}</small></h2>
                <ul>
        `;
        
        treino.exercicios.forEach(ex => {
            htmlTreino += `
                <li class="exercicio">
                    <strong>${ex.nome}</strong>: ${ex.series}x${ex.reps}
                </li>`;
        });
        
        htmlTreino += `</ul></div>`;
        containerTreinos.innerHTML = htmlTreino;
    } else {
        // Se for Domingo ou um dia de descanso configurado
        containerTreinos.innerHTML = "<h2>🛋️ Hoje é dia de descanso/off!</h2>";
    }
}

        // Executa a função assim que a página abre
        carregarTreino();

  const treinosDoDia = treinos.divisao_treino[dia]?.exercicios;

  if (!treinosDoDia) {
    console.error("Treino não encontrado para o dia: " + dia);
    return;
  }

  // 3. FAZ O LOOP USANDO OS NOVOS NOMES DE PROPRIEDADES
  treinosDoDia.forEach((ex, i) => {

    // O novo JSON não tem 'grupoMuscular' por exercício, mas se você precisar no futuro, pode manter a lógica abaixo
    if(grupoFiltro && ex.grupoMuscular !== grupoFiltro){
      return;
    }

    estado[i] = {
      ativo: false,
      tempo: 0,
    };

    /* ===== TABELA ===== */
    // Alterado: ex.exercicio -> ex.nome | ex.variacao removido (coloquei vazio "" pois não existe no seu JSON)
    tabela.innerHTML += `
      <tr>
        <td>${ex.nome}</td>
        <td>""</td>
        <td>${ex.series}</td>
        <td>${ex.reps}</td>
        <td>${ex.descanso}s</td>

      </tr>
    `;
    const link = `https://www.youtube.com/watch?v=${ex.video}`;
    /* ===== LISTA ===== */
    // Alterado: ex.exercicio -> ex.nome | ex.variacao removido das strings e dos nomes das imagens
    lista.innerHTML += `
      <li class="li_ex" onclick="expandImgsEx(${i})">
        <span>${ex.nome}</span>
        <span> </span> 
        <span>${ex.series}x${ex.reps}</span>
        <span id="t${i}">0s</span>
        <span id="d${i}">--</span>
        <span id="s${i}"><img src="iSetaEx.png" style="width:20px;"/></span>
      </li>
      <div class="imgs-Ex" style="width: 100%;overflow-x:scroll;">
        <td>${link}</td>
      </div>
    `;
  });
}

function iniciarDescanso(index){
  const estado = estadoExercicios[index];

  estado.descansoRestante = estado.descansoTotal;

  estado.descansoIntervalo = setInterval(() => {

    estado.descansoRestante--;

    document.getElementById(`descanso-${index}`).innerText =
      estado.descansoRestante + "s";

    if(estado.descansoRestante <= 0){
      clearInterval(estado.descansoIntervalo);

      document.getElementById(`descanso-${index}`).innerText = "GO!";

      notificar("Descanso acabou 💪");

      if(navigator.vibrate){
        navigator.vibrate([200,100,200]);
      }
    }

  }, 1000);
}

function expandImgsEx(i){
  const el = document.getElementsByClassName("imgs-Ex")[i];
  const seta = document.getElementById("s" + i);

  el.classList.toggle("ativo");
  seta.classList.toggle("rotacionado");

  if(i>0){
    
    document.getElementsByClassName("imgs-Ex")[i-1].classList.toggle("ativo");
    document.getElementById("s" + i ).classList.toggle("rotacionado");
  }
}

function expandImgsEx(i){
  const todos = document.getElementsByClassName("imgs-Ex");
  const atual = todos[i];
  const seta = document.getElementById("s" + i);
  const jaEstaAberto = atual.classList.contains("ativo");

  // Fecha todos
  for(let j = 0; j < todos.length; j++){
    todos[j].classList.remove("ativo");
    
    const seta = document.getElementById("s" + j);
    if(seta){
      seta.style = "transition: all .3s;"
      seta.classList.remove("rotacionado");
    }
  }

  // Se NÃO estava aberto, abre
  if(!jaEstaAberto){
    atual.classList.add("ativo");
    seta.classList.toggle("rotacionado");
  }
}
